[project]
name = "scry"
version = "0.1.0"
description = "Peer into code health: SonarQube + SonarCloud client with one-shot analysis driver."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "manz" }]
keywords = ["sonarqube", "sonarcloud", "static-analysis", "lint", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "respx>=0.22",
]

[project.urls]
Homepage = "https://github.com/manz/scry"
Issues = "https://github.com/manz/scry/issues"

[project.scripts]
scry = "scry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scry"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle / pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "RUF",          # ruff-specific
    "PL",           # pylint subset
    "SIM",          # simplify
]
ignore = ["PLR0913"]  # function with many arguments — common for CLI

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]  # magic numbers + asserts are fine in tests

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
