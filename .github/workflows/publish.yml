name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build wheel + sdist, upload to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI trusted publishing
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/scry

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
